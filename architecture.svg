<svg width="1000" height="640" viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#FBFBFD"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">ChitraPramaan — System Architecture</text>
  <text x="500" y="55" text-anchor="middle" font-size="12.5" fill="#64748B">The CLI and backend both call one shared pipeline package — no logic is duplicated between adapters</text>

  <!-- Client layer -->
  <rect x="40" y="86" width="220" height="64" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="150" y="112" text-anchor="middle" font-size="13.5" font-weight="600" fill="#312E81">CLI</text>
  <text x="150" y="130" text-anchor="middle" font-size="11" font-family="monospace" fill="#4338CA">cli/run.py</text>

  <rect x="740" y="86" width="220" height="64" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="850" y="112" text-anchor="middle" font-size="13.5" font-weight="600" fill="#312E81">Frontend — Next.js</text>
  <text x="850" y="130" text-anchor="middle" font-size="11" font-family="monospace" fill="#4338CA">frontend/</text>

  <!-- Backend -->
  <rect x="670" y="196" width="290" height="70" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="815" y="224" text-anchor="middle" font-size="13.5" font-weight="600" fill="#065F46">Backend — FastAPI</text>
  <text x="815" y="242" text-anchor="middle" font-size="11" font-family="monospace" fill="#047857">backend/main.py</text>
  <text x="815" y="258" text-anchor="middle" font-size="10" fill="#059669">only NEXT_PUBLIC_API_BASE_URL crosses this line</text>

  <!-- Shared pipeline -->
  <rect x="230" y="316" width="540" height="76" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="1.8"/>
  <text x="500" y="346" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0F172A">Shared Pipeline Package</text>
  <text x="500" y="365" text-anchor="middle" font-size="11" font-family="monospace" fill="#334155">pipeline/src/provenance_pipeline</text>
  <text x="500" y="381" text-anchor="middle" font-size="10" fill="#64748B">detect → crop → search → filter → re-rank → claim → pin → anchor</text>

  <!-- External services row -->
  <rect x="40" y="452" width="210" height="66" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="145" y="478" text-anchor="middle" font-size="12.5" font-weight="600" fill="#78350F">InsightFace + ONNX</text>
  <text x="145" y="495" text-anchor="middle" font-size="10.5" fill="#92400E">face detect / embed</text>

  <rect x="272" y="452" width="210" height="66" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="377" y="478" text-anchor="middle" font-size="12.5" font-weight="600" fill="#78350F">SerpApi</text>
  <text x="377" y="495" text-anchor="middle" font-size="10.5" fill="#92400E">Google Lens reverse search</text>

  <rect x="504" y="452" width="210" height="66" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="609" y="478" text-anchor="middle" font-size="12.5" font-weight="600" fill="#78350F">Pinata</text>
  <text x="609" y="495" text-anchor="middle" font-size="10.5" fill="#92400E">pins claim JSON to IPFS</text>

  <rect x="736" y="452" width="222" height="66" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="847" y="474" text-anchor="middle" font-size="12.5" font-weight="600" fill="#78350F">Ethereum Sepolia</text>
  <text x="847" y="491" text-anchor="middle" font-size="10.5" fill="#92400E">Registry contract, first-seen</text>
  <text x="847" y="506" text-anchor="middle" font-size="9.5" font-family="monospace" fill="#B45309">0x1Df668f…B14B4272B</text>

  <!-- Independent verifier -->
  <rect x="290" y="560" width="420" height="62" rx="10" fill="#FFF7ED" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="500" y="586" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7C2D12">Independent verifier</text>
  <text x="500" y="603" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#9A3412">scripts/reverify.py — no search / wallet / Pinata keys needed</text>

  <!-- Arrows: clients down to backend/pipeline -->
  <path d="M150,150 L270,316" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M850,150 L850,196" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M815,266 L570,316" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Arrows: pipeline down to external services -->
  <path d="M400,392 L155,452" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M450,392 L390,452" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M550,392 L610,452" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M600,392 L840,452" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Arrows: verifier reads only IPFS + Sepolia -->
  <path d="M420,560 L620,518" fill="none" stroke="#B45309" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrowDash)"/>
  <path d="M600,560 L847,518" fill="none" stroke="#B45309" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrowDash)"/>
</svg>
