<svg width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4338CA"/>
    </marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
    </marker>
    <marker id="aBridge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="560" fill="#FBFBFD"/>
  <text x="600" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">ChitraPramaan — End-to-End Pipeline</text>
  <text x="600" y="52" text-anchor="middle" font-size="12.5" fill="#64748B">A recommendation always passes through explicit human review before anything is pinned or anchored</text>

  <!-- Lane headers -->
  <rect x="30" y="76" width="352" height="34" rx="8" fill="#0F766E"/>
  <text x="206" y="99" text-anchor="middle" font-size="13.5" font-weight="700" fill="#F0FDFA">1 · Search &amp; Analyze</text>

  <rect x="424" y="76" width="352" height="34" rx="8" fill="#4338CA"/>
  <text x="600" y="99" text-anchor="middle" font-size="13.5" font-weight="700" fill="#EEF2FF">2 · Human Review &amp; Anchor</text>

  <rect x="818" y="76" width="352" height="34" rx="8" fill="#B45309"/>
  <text x="994" y="99" text-anchor="middle" font-size="13.5" font-weight="700" fill="#FFF7ED">3 · Independent Verification</text>

  <!-- Lane 1 steps -->
  <g font-size="11.5" fill="#134E4A">
    <rect x="46" y="126" width="320" height="46" rx="7" fill="#F0FDFA" stroke="#0F766E"/>
    <text x="206" y="153" text-anchor="middle">Validate &amp; decode upload</text>
    <path d="M206,172 L206,196" stroke="#0F766E" stroke-width="1.4" marker-end="url(#a1)"/>

    <rect x="46" y="196" width="320" height="46" rx="7" fill="#F0FDFA" stroke="#0F766E"/>
    <text x="206" y="223" text-anchor="middle">Detect faces → select subject</text>
    <path d="M206,242 L206,266" stroke="#0F766E" stroke-width="1.4" marker-end="url(#a1)"/>

    <rect x="46" y="266" width="320" height="46" rx="7" fill="#F0FDFA" stroke="#0F766E"/>
    <text x="206" y="289" text-anchor="middle">Deterministic crop</text>
    <text x="206" y="304" text-anchor="middle" font-size="9.5" fill="#0D9488">320×320 · JPEG q95 · fixed 4:2:0</text>
    <path d="M206,312 L206,336" stroke="#0F766E" stroke-width="1.4" marker-end="url(#a1)"/>

    <rect x="46" y="336" width="320" height="46" rx="7" fill="#F0FDFA" stroke="#0F766E"/>
    <text x="206" y="363" text-anchor="middle">SerpApi reverse image search</text>
    <path d="M206,382 L206,406" stroke="#0F766E" stroke-width="1.4" marker-end="url(#a1)"/>

    <rect x="46" y="406" width="320" height="46" rx="7" fill="#F0FDFA" stroke="#0F766E"/>
    <text x="206" y="433" text-anchor="middle">Filter to allow-listed domains</text>
    <path d="M206,452 L206,476" stroke="#0F766E" stroke-width="1.4" marker-end="url(#a1)"/>

    <rect x="46" y="476" width="320" height="46" rx="7" fill="#F0FDFA" stroke="#0F766E"/>
    <text x="206" y="503" text-anchor="middle">Re-rank by face-embedding similarity</text>
  </g>

  <!-- Bridge 1 -> 2 -->
  <path d="M382,93 L424,93" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#aBridge)"/>

  <!-- Lane 2 steps -->
  <g font-size="11.5" fill="#1E1B4B">
    <rect x="440" y="126" width="320" height="46" rx="7" fill="#EEF2FF" stroke="#4338CA"/>
    <text x="600" y="149" text-anchor="middle">Ranked candidates always shown</text>
    <text x="600" y="164" text-anchor="middle" font-size="9.5" fill="#4F46E5">recommendation ≠ auto-anchor</text>
    <path d="M600,172 L600,196" stroke="#4338CA" stroke-width="1.4" marker-end="url(#a2)"/>

    <rect x="440" y="196" width="320" height="46" rx="7" fill="#EEF2FF" stroke="#4338CA"/>
    <text x="600" y="223" text-anchor="middle">User reviews &amp; explicitly confirms</text>
    <path d="M600,242 L600,266" stroke="#4338CA" stroke-width="1.4" marker-end="url(#a2)"/>

    <rect x="440" y="266" width="320" height="46" rx="7" fill="#EEF2FF" stroke="#4338CA"/>
    <text x="600" y="293" text-anchor="middle">Build claim (fingerprint + envelope)</text>
    <path d="M600,312 L600,336" stroke="#4338CA" stroke-width="1.4" marker-end="url(#a2)"/>

    <rect x="440" y="336" width="320" height="46" rx="7" fill="#EEF2FF" stroke="#4338CA"/>
    <text x="600" y="363" text-anchor="middle">Pin complete claim JSON to IPFS</text>
    <path d="M600,382 L600,406" stroke="#4338CA" stroke-width="1.4" marker-end="url(#a2)"/>

    <rect x="440" y="406" width="320" height="46" rx="7" fill="#EEF2FF" stroke="#4338CA"/>
    <text x="600" y="433" text-anchor="middle">Anchor fingerprint + CID on Sepolia</text>
  </g>

  <!-- Bridge 2 -> 3 -->
  <path d="M776,93 L818,93" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#aBridge)"/>

  <!-- Lane 3 steps -->
  <g font-size="11.5" fill="#7C2D12">
    <rect x="834" y="126" width="320" height="46" rx="7" fill="#FFF7ED" stroke="#B45309"/>
    <text x="994" y="153" text-anchor="middle">Read Registry for the fingerprint</text>
    <path d="M994,172 L994,196" stroke="#B45309" stroke-width="1.4" marker-end="url(#a3)"/>

    <rect x="834" y="196" width="320" height="46" rx="7" fill="#FFF7ED" stroke="#B45309"/>
    <text x="994" y="223" text-anchor="middle">Fetch claim JSON from IPFS gateway</text>
    <path d="M994,242 L994,266" stroke="#B45309" stroke-width="1.4" marker-end="url(#a3)"/>

    <rect x="834" y="266" width="320" height="46" rx="7" fill="#FFF7ED" stroke="#B45309"/>
    <text x="994" y="293" text-anchor="middle">Recompute fingerprint locally</text>
    <path d="M994,312 L994,336" stroke="#B45309" stroke-width="1.4" marker-end="url(#a3)"/>

    <rect x="834" y="336" width="320" height="46" rx="7" fill="#FFF7ED" stroke="#B45309"/>
    <text x="994" y="363" text-anchor="middle">Compare fetched vs. on-chain key</text>
    <path d="M994,382 L994,406" stroke="#B45309" stroke-width="1.4" marker-end="url(#a3)"/>

    <rect x="834" y="406" width="320" height="46" rx="7" fill="#FFF7ED" stroke="#B45309"/>
    <text x="994" y="429" text-anchor="middle" font-weight="600">PASS / mismatch / unavailable</text>
    <text x="994" y="444" text-anchor="middle" font-size="9.5" fill="#B45309">mismatch is a result, not an error</text>
  </g>

  <text x="600" y="542" text-anchor="middle" font-size="11" fill="#94A3B8">Anyone can re-run stage 3 independently — it needs only the claim JSON and the contract address, never the search / wallet / Pinata keys</text>
</svg>
